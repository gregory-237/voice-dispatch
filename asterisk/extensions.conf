; Include this file from extensions.conf. Route the inbound DID to vd-in,s,1.
[vd-in]
exten => s,1,Answer()
 same => n,Set(VD_UUID=${UUID()})
 same => n,Goto(vd-audio,s,1)

[vd-callback]
exten => s,1,NoOp(VoiceDispatch outbound)
 same => n,Goto(vd-audio,s,1)

[vd-audio]
exten => s,1,TryExec(AudioSocket(${VD_UUID},127.0.0.1:9092))
 same => n,Set(VD_OUTCOME=${DB_DELETE(vd-result/${VD_UUID})})
 same => n,GotoIf($["${VD_OUTCOME}" = "done"]?finished)
 same => n,Dial(PJSIP/dispatcher,45)
 same => n(finished),Hangup()

[vd-desk]
exten => 700,1,Goto(vd-in,s,1)
