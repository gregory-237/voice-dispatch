; Include after replacing secrets and carrier settings. Reuse your existing transport if present.
[vd-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[dispatcher]
type=endpoint
context=vd-desk
disallow=all
allow=alaw,ulaw
auth=desk-auth
aors=dispatcher
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[dispatcher]
type=aor
max_contacts=1
remove_existing=yes

[desk-auth]
type=auth
auth_type=userpass
username=dispatcher
password=REPLACE_WITH_DESK_SECRET

[carrier]
type=endpoint
context=vd-carrier-in
disallow=all
allow=alaw,ulaw
aors=carrier
outbound_auth=carrier-auth
direct_media=no

[carrier]
type=aor
contact=sip:pbx.example.invalid

[carrier-auth]
type=auth
auth_type=userpass
username=REPLACE_WITH_TRUNK_USER
password=REPLACE_WITH_TRUNK_SECRET

[carrier-identify]
type=identify
endpoint=carrier
match=192.0.2.1
