name: voice-dispatch
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_DB: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/configure.py}
    ports: ["127.0.0.1:55438:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56388:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.6.8
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11458:11434"]
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dispatch:${POSTGRES_PASSWORD}@db/dispatch
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080","127.0.0.1:9092:9092"]
    volumes: ["./models:/app/models:ro","./var:/app/var"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pg:
  ollama:
